name: Publish current plugin version

on:
  push:
    branches:
      - main
    paths:
      - ".github/PUBLISH_VERSION"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Verify release metadata
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          node -e "const m=require('./manifest.json'); const v=require('./versions.json'); if(v[m.version]!==m.minAppVersion) process.exit(1)"

      - name: Run plugin checks
        run: npm run verify

      - name: Build release archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip "pointix-file-hub-$VERSION.zip" manifest.json main.js styles.css

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          gh release create "$VERSION" \
            manifest.json \
            main.js \
            styles.css \
            "pointix-file-hub-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Pointix File Hub $VERSION" \
            --notes "Public beta release of Pointix File Hub $VERSION. See CHANGELOG.md for details." \